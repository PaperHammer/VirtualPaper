name: Pre-release
run-name: "[Manual] Pre-release | PR #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Merged dev -> main PR number'
        required: true
        type: number

concurrency:
  group: pre-release-main
  cancel-in-progress: false  # 同一时间只允许一个构建，确保版本号不发生竞争

defaults:
  run:
    shell: pwsh

permissions:
  contents: write
  statuses: read
  pull-requests: read

env:
  RELEASE_BIN_DIR: ${{ github.workspace }}/src/VirtualPaper/bin/Release/net8.0-windows10.0.19041.0

jobs:
  prepare-metadata:
    name: Prepare Metadata
    runs-on: windows-latest
    outputs:
      msstore_enabled: ${{ steps.release-pr.outputs.msstore_enabled }}
      selection_labels: ${{ steps.release-pr.outputs.selection_labels }}
      msix_version: ${{ steps.store-config.outputs.msix_version }}
      current_version: ${{ steps.release-version.outputs.current_version }}
      new_version: ${{ steps.release-version.outputs.new_version }}
      main_sha: ${{ steps.release-pr.outputs.merge_sha }}
      pr_body: ${{ steps.release-pr.outputs.body }}
      has_plugin_update: ${{ steps.release-version.outputs.has_plugin_update }}
      update_plugins: ${{ steps.release-version.outputs.update_plugins }}
      build_number: ${{ steps.release-version.outputs.build_number }}
      release_tag: ${{ steps.release-version.outputs.release_tag }}
      release_title: ${{ steps.release-version.outputs.release_title }}
      app_comp_manifest: ${{ steps.component-manifest.outputs.app_comp_manifest }}

    steps:
    - name: Validate release PR
      id: release-pr
      uses: actions/github-script@v7
      with:
        script: |
          const number = Number(context.payload.inputs.pr_number);
          if (!Number.isSafeInteger(number) || number <= 0) throw new Error('Enter a positive PR number.');
          const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
          if (!pr.merged || pr.base.ref !== 'main' || pr.head.ref !== 'dev' ||
              pr.head.repo?.full_name !== context.payload.repository.full_name) {
            throw new Error('Pre-release requires a merged same-repository dev -> main PR.');
          }
          const allowed = ['version:major', 'version:minor', 'version:build', 'version:revision'];
          const selected = pr.labels.map(label => label.name).filter(name => allowed.includes(name));
          if (selected.length !== 1) throw new Error(`Select exactly one version label: ${allowed.join(', ')}.`);
          const msstore = pr.labels.some(label => label.name === 'channel:msstore');
          core.setOutput('msstore_enabled', msstore.toString());
          core.setOutput('selection_labels', JSON.stringify(pr.labels.map(label => label.name).filter(name => name.startsWith('version:') || name.startsWith('update-plugin') || name === 'channel:msstore').sort()));
          const { data: checks } = await github.rest.repos.getCombinedStatusForRef({ ...context.repo, ref: pr.head.sha });
          const check = checks.statuses.find(status => status.context === 'pre-merge-check');
          if (check?.state !== 'success' || !check.description?.startsWith(`[PR #${number} | ${selected[0]} | msstore:${msstore}] `)) {
            throw new Error('The merged PR head must have a successful manual pre-merge-check status for this PR and version label.');
          }
          const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
          if (main.object.sha !== pr.merge_commit_sha) throw new Error('main has advanced. Publish the latest merged PR, or retry only the failed jobs of the original run.');
          core.setOutput('merge_sha', pr.merge_commit_sha);
          core.setOutput('labels', pr.labels.map(label => label.name).join(','));
          core.setOutput('increment', selected[0].slice('version:'.length));
          core.setOutput('body', pr.body || '');

    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.release-pr.outputs.merge_sha }}
        persist-credentials: false

    - name: Read release baseline
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        . ./.github/scripts/ReleaseMetadata.ps1
        $history = Get-ReleaseHistory -Repository $env:GITHUB_REPOSITORY
        $manifest = Get-ReleaseBaseline -Repository $env:GITHUB_REPOSITORY -History $history -ManifestPath "$env:RUNNER_TEMP/previous-app-comp-manifest.json"
        $builds = @($history.Builds)
        if ($manifest) { $builds += $manifest.app_build_number; $builds += @($manifest.plugins.Values) }
        @{ builds = $builds; manifest = $manifest } | ConvertTo-Json -Depth 10 | Set-Content release-baseline.json -Encoding utf8NoBOM

    - name: Calculate version and build
      id: release-version
      shell: pwsh
      env:
        PR_LABELS: ${{ steps.release-pr.outputs.labels }}
        INCREMENT: ${{ steps.release-pr.outputs.increment }}
      run: |
        . ./.github/scripts/ReleaseVersion.ps1
        . ./.github/scripts/ReleaseMetadata.ps1
        $content = Get-Content src/VirtualPaper/VirtualPaper.csproj -Raw
        $versions = [regex]::Matches($content, '<AssemblyVersion>(\d+\.\d+\.\d+\.\d+)</AssemblyVersion>')
        if ($versions.Count -ne 1) { throw 'Expected exactly one AssemblyVersion.' }
        $currentVersion = $versions[0].Groups[1].Value
        $labels = $env:PR_LABELS -split ',' | ForEach-Object { $_.Trim() }
        $plugins = @('UI', 'PlayerWeb', 'ScrSaver', 'ML', 'Shaders') | Where-Object {
            $labels -contains 'update-plugins' -or $labels -contains "update-plugin-$($_.ToLowerInvariant())"
        }
        $plugins = @($plugins)
        $isPluginUpdate = $plugins.Count -gt 0
        $newVersion = if ($isPluginUpdate) { $currentVersion } else { Get-NextReleaseVersion $currentVersion $env:INCREMENT }
        $baseline = Get-Content release-baseline.json -Raw | ConvertFrom-Json -AsHashtable
        $buildNumber = Get-NextReleaseBuildNumber -PreviousBuilds $baseline.builds
        $releaseTag = "v$newVersion"
        $releaseTitle = "v$newVersion (Build $buildNumber)"
        if ($isPluginUpdate) {
            # Encode digits as A-J to retain compatibility with the old client's version parser.
            $encoded = ($buildNumber.ToCharArray() | ForEach-Object {
                if ($_ -ge '0' -and $_ -le '9') { [char]([int][char]'A' + [int]$_ - [int][char]'0') } else { $_ }
            }) -join ''
            $releaseTag += "plugin$encoded"
            $releaseTitle = "v$newVersion Plugin Update (Build $buildNumber)"
        }
        $outputs = [ordered]@{
            current_version = $currentVersion
            new_version = $newVersion
            has_plugin_update = $isPluginUpdate.ToString().ToLowerInvariant()
            update_plugins = $plugins -join ';'
            build_number = $buildNumber
            release_tag = $releaseTag
            release_title = $releaseTitle
        }
        foreach ($entry in $outputs.GetEnumerator()) { "$($entry.Key)=$($entry.Value)" >> $env:GITHUB_OUTPUT }
        Write-Host "$currentVersion -> $newVersion | $releaseTitle"

    - name: Validate Partner Center configuration
      id: store-config
      if: steps.release-pr.outputs.msstore_enabled == 'true'
      shell: pwsh
      env:
        MSSTORE_APPLICATION_ID: ${{ vars.MSSTORE_APPLICATION_ID }}
        MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
        MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
        MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        MSSTORE_TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
        MSSTORE_CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
        MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        BUILD_NUMBER: ${{ steps.release-version.outputs.build_number }}
        SOURCE_SHA: ${{ steps.release-pr.outputs.merge_sha }}
      run: ./.github/scripts/Invoke-StoreDraft.ps1 -Action Validate -BuildNumber $env:BUILD_NUMBER -SourceSha $env:SOURCE_SHA

    - name: Check release availability
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.release-version.outputs.release_tag }}
      run: |
        . ./.github/scripts/ReleaseMetadata.ps1
        Assert-ReleaseTagAvailable -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG

    - name: Build component manifest
      id: component-manifest
      shell: pwsh
      env:
        BUILD_NUMBER: ${{ steps.release-version.outputs.build_number }}
        HAS_PLUGIN_UPDATE: ${{ steps.release-version.outputs.has_plugin_update }}
        UPDATE_PLUGINS: ${{ steps.release-version.outputs.update_plugins }}
      run: |
        . ./.github/scripts/ReleaseMetadata.ps1
        $baseline = Get-Content release-baseline.json -Raw | ConvertFrom-Json -AsHashtable
        $plugins = @($env:UPDATE_PLUGINS -split ';' | Where-Object { $_ })
        $manifest = New-ComponentManifest -BuildNumber $env:BUILD_NUMBER -PluginUpdate:($env:HAS_PLUGIN_UPDATE -eq 'true') -UpdatePlugins $plugins -Previous $baseline.manifest
        $json = $manifest | ConvertTo-Json -Depth 10 -Compress
        "app_comp_manifest=$json" >> $env:GITHUB_OUTPUT
  build-release:
    name: Build Release
    runs-on: windows-latest
    needs: prepare-metadata

    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare-metadata.outputs.main_sha }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check workflow contracts
      shell: pwsh
      run: ./.github/scripts/validate-test-workflow.ps1

    - name: Set up .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'test/**/*.csproj', 'src/**/*.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Set application version
      shell: pwsh
      run: |
        $csprojPath = "src/VirtualPaper/VirtualPaper.csproj"
        $content = Get-Content $csprojPath -Raw
        $newVersion = "${{ needs.prepare-metadata.outputs.new_version }}"
        $newContent = $content -replace '<AssemblyVersion>\d+\.\d+\.\d+\.\d+</AssemblyVersion>', "<AssemblyVersion>$newVersion</AssemblyVersion>"
        Set-Content $csprojPath -Value $newContent -NoNewline
        Write-Host "Patched AssemblyVersion to $newVersion (build-time only)"

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Release solution
      run: msbuild src/VirtualPaper.sln /t:Rebuild /p:Configuration=Release /p:Platform="Any CPU" /restore /m

    - name: Write component manifest
      shell: pwsh
      env:
        APP_COMP_MANIFEST: ${{ needs.prepare-metadata.outputs.app_comp_manifest }}
      run: |
        $json = $env:APP_COMP_MANIFEST | ConvertFrom-Json -AsHashtable | ConvertTo-Json -Depth 10
        $json | Set-Content "$env:RELEASE_BIN_DIR/app_comp_manifest.json" -Encoding utf8NoBOM
        Copy-Item "$env:RELEASE_BIN_DIR/app_comp_manifest.json" app_comp_manifest.json

    - name: Upload build output
      uses: actions/upload-artifact@v7.0.2
      with:
        overwrite: true
        name: build-release-output
        path: |
          src/
          test/actions/run-project/action.yml
          test/Run-ProjectTests.ps1
          test/TestReportSupport.ps1
          test/VirtualPaper.UIOperationTest/VirtualPaper.UIOperationTest.csproj
          test/VirtualPaper.UIOperationTest/bin/x64/Release/
          test/VirtualPaper.InstallerTest/VirtualPaper.InstallerTest.csproj
          test/VirtualPaper.InstallerTest/bin/Release/
        retention-days: 7

    - name: Upload component manifest
      uses: actions/upload-artifact@v7.0.2
      with:
        overwrite: true
        name: app-comp-manifest
        path: app_comp_manifest.json
        retention-days: 30
  package-exe:
    name: Package EXE
    runs-on: windows-latest
    needs: [prepare-metadata, build-release]
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare-metadata.outputs.main_sha }}
        persist-credentials: false
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-release-output
        path: .
    - name: Install Inno Setup 6.7.1
      run: choco install innosetup --version=6.7.1 --no-progress -y
    - name: Package EXE
      env:
        SOURCE_SHA: ${{ needs.prepare-metadata.outputs.main_sha }}
        RELEASE_VERSION: ${{ needs.prepare-metadata.outputs.new_version }}
        BUILD_NUMBER: ${{ needs.prepare-metadata.outputs.build_number }}
        UPDATE_PLUGINS: ${{ needs.prepare-metadata.outputs.update_plugins }}
      run: |
        ./.github/scripts/New-CIExePackage.ps1 -SourceSha $env:SOURCE_SHA -Version $env:RELEASE_VERSION `
          -BuildNumber $env:BUILD_NUMBER -UpdatePlugins $env:UPDATE_PLUGINS
    - name: Upload package-exe
      uses: actions/upload-artifact@v7.0.2
      with:
        overwrite: true
        name: package-exe
        path: dist/exe/
        if-no-files-found: error
        retention-days: 30
  package-msix:
    name: Package MSIX
    runs-on: windows-latest
    needs: [prepare-metadata, build-release]
    if: needs.prepare-metadata.outputs.msstore_enabled == 'true'
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare-metadata.outputs.main_sha }}
        persist-credentials: false
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-release-output
        path: .
    - name: Set up .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: 8.0.x
    - name: Package signed MSIX
      env:
        SOURCE_SHA: ${{ needs.prepare-metadata.outputs.main_sha }}
        MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
        MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
        MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        MSIX_VERSION: ${{ needs.prepare-metadata.outputs.msix_version }}
      run: |
        ./.github/scripts/New-CIMsixPackage.ps1 -SourceSha $env:SOURCE_SHA -Store `
          -IdentityName $env:MSSTORE_IDENTITY_NAME -Publisher $env:MSSTORE_PUBLISHER `
          -PublisherDisplayName $env:MSSTORE_PUBLISHER_DISPLAY_NAME -PackageVersion $env:MSIX_VERSION
    - name: Upload package-msix
      uses: actions/upload-artifact@v7.0.2
      with:
        overwrite: true
        name: package-msix
        path: |
          dist/msix/*.msix
          dist/msix/*.msixupload
          dist/msix/*.appxupload
          dist/msix/package.json
          dist/msix/acceptance.cer
        if-no-files-found: error
        retention-days: 30
  packages-ready:
    name: Packages Ready
    runs-on: ubuntu-latest
    needs: [prepare-metadata, build-release, package-exe, package-msix]
    if: always() && !cancelled()
    steps:
    - name: Require selected packages
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
        MSIX_ENABLED: ${{ needs.prepare-metadata.outputs.msstore_enabled }}
      run: |
        $jobs = $env:JOB_RESULTS | ConvertFrom-Json -AsHashtable
        foreach ($name in @('prepare-metadata', 'build-release', 'package-exe')) {
          if ($jobs[$name].result -ne 'success') { throw "Required prerequisite failed: $name" }
        }
        $expected = if ($env:MSIX_ENABLED -eq 'true') { 'success' } else { 'skipped' }
        if ($jobs['package-msix'].result -ne $expected) { throw 'MSIX packaging did not match channel selection.' }
  test-artifacts:
    name: Artifact Tests
    runs-on: windows-latest
    needs: [prepare-metadata, build-release, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-release-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-artifacts
        require-complete-execution: 'true'
  test-core:
    name: Core Tests
    runs-on: windows-latest
    needs: [prepare-metadata, build-release, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-release-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-core
        require-complete-execution: 'true'
  test-ui-logic:
    name: UI Logic Tests
    runs-on: windows-latest
    needs: [prepare-metadata, build-release, packages-ready]
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare-metadata.outputs.main_sha }}
        persist-credentials: false
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-release-output
        path: .
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Test web players
      run: |
        node .github/scripts/test-atmosphere.cjs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        node .github/scripts/test-depth-player.cjs
        exit $LASTEXITCODE
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-ui-logic
        require-complete-execution: 'true'
  test-images:
    name: Static Image Tests
    runs-on: windows-latest
    needs: [prepare-metadata, build-release, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-release-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-images
        require-complete-execution: 'true'
  test-web-backdrop:
    name: Web Backdrop Tests
    runs-on: windows-latest
    needs: [prepare-metadata, build-release, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-release-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-web-backdrop
        require-complete-execution: 'true'
  test-ui-components:
    name: UI Component Tests
    runs-on: windows-latest
    needs: [prepare-metadata, build-release, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-release-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-ui-components
        require-complete-execution: 'true'
  test-ml:
    name: ML Tests
    runs-on: windows-latest
    needs: [prepare-metadata, build-release, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-release-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-ml
        require-complete-execution: 'true'
        include-ml-integration: 'true'
  test-shader:
    name: Shader Tests
    runs-on: windows-latest
    needs: [prepare-metadata, build-release, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-release-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-shader
        require-complete-execution: 'true'
  test-exe-acceptance:
    name: EXE Installed Acceptance
    needs: [prepare-metadata, build-release, packages-ready, test-artifacts, test-core, test-ui-logic, test-images, test-web-backdrop, test-ui-components, test-ml, test-shader]
    uses: ./.github/workflows/package-acceptance.yml
    with:
      channel: exe
      source-sha: ${{ needs.prepare-metadata.outputs.main_sha }}
      build-artifact: build-release-output
  test-msix-acceptance:
    name: MSIX Installed Acceptance
    needs: [prepare-metadata, build-release, packages-ready, test-artifacts, test-core, test-ui-logic, test-images, test-web-backdrop, test-ui-components, test-ml, test-shader]
    if: needs.prepare-metadata.outputs.msstore_enabled == 'true'
    uses: ./.github/workflows/package-acceptance.yml
    with:
      channel: msix
      source-sha: ${{ needs.prepare-metadata.outputs.main_sha }}
      build-artifact: build-release-output
  summarize-tests:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [prepare-metadata, build-release, package-exe, package-msix, packages-ready, test-artifacts, test-core, test-ui-logic, test-images, test-web-backdrop, test-ui-components, test-ml, test-shader, test-exe-acceptance, test-msix-acceptance]
    if: always() && needs.prepare-metadata.result == 'success'
    outputs:
      ui_outcome: ${{ steps.reports.outputs.ui_outcome }}
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare-metadata.outputs.main_sha }}
        persist-credentials: false
    - name: Download test reports
      uses: actions/download-artifact@v8.0.2
      with:
        pattern: test-results-*
        path: TestResults/
    - name: Download package-exe
      uses: actions/download-artifact@v8.0.2
      with:
        name: package-exe
        path: PackageArtifacts/exe
    - name: Download package-msix
      if: always() && needs.package-msix.result == 'success'
      uses: actions/download-artifact@v8.0.2
      with:
        name: package-msix
        path: PackageArtifacts/msix
    - name: Summarize package acceptance
      id: reports
      if: always()
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
        SOURCE_SHA: ${{ needs.prepare-metadata.outputs.main_sha }}
        MSIX_ENABLED: ${{ needs.prepare-metadata.outputs.msstore_enabled }}
      run: |
        ./test/Summarize-PipelineTests.ps1 -Root TestResults -ArtifactsRoot PackageArtifacts `
          -SourceSha $env:SOURCE_SHA -JobResultsJson $env:JOB_RESULTS -MsixEnabled:($env:MSIX_ENABLED -eq 'true')
    - name: Upload test summary
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        overwrite: true
        name: release-test-summary
        path: TestResults/
        if-no-files-found: warn
        retention-days: 30
  sync-versions:
    name: Sync Versions
    runs-on: windows-latest
    needs: [prepare-metadata, package-exe, summarize-tests]
    if: needs.prepare-metadata.outputs.has_plugin_update != 'true'
    outputs:
      main_sha: ${{ steps.sync-versions.outputs.main_sha }}
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare-metadata.outputs.main_sha }}
        token: ${{ secrets.RELEASE_PAT }}
        fetch-depth: 0
    - name: Recheck release selection
      uses: actions/github-script@v7
      env:
        EXPECTED_MSSTORE: ${{ needs.prepare-metadata.outputs.msstore_enabled }}
        EXPECTED_SELECTION: ${{ needs.prepare-metadata.outputs.selection_labels }}
      with:
        script: |
          const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(context.payload.inputs.pr_number)});
          const selection = JSON.stringify(pr.labels.map(label => label.name).filter(name => name.startsWith('version:') || name.startsWith('update-plugin') || name === 'channel:msstore').sort());
          if (selection !== process.env.EXPECTED_SELECTION || !pr.merged || pr.merge_commit_sha !== '${{ needs.prepare-metadata.outputs.main_sha }}' ||
              pr.labels.some(label => label.name === 'channel:msstore') !== (process.env.EXPECTED_MSSTORE === 'true')) {
            throw new Error('Release PR/channel changed during this run.');
          }
    - name: Recheck release availability
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare-metadata.outputs.release_tag }}
      run: |
        . ./.github/scripts/ReleaseMetadata.ps1
        Assert-ReleaseTagAvailable -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG

    - name: Commit main version and merge main into dev
      id: sync-versions
      shell: pwsh
      env:
        MERGE_SHA: ${{ needs.prepare-metadata.outputs.main_sha }}
        NEW_VERSION: ${{ needs.prepare-metadata.outputs.new_version }}
        CURRENT_VERSION: ${{ needs.prepare-metadata.outputs.current_version }}
      run: |
        . ./.github/scripts/ReleaseVersion.ps1
        Invoke-ReleaseGit @('config', 'user.email', 'action@github.com')
        Invoke-ReleaseGit @('config', 'user.name', 'GitHub Action')
        $sha = Sync-ReleaseVersion -Root $PWD.Path -MergeSha $env:MERGE_SHA -Version $env:NEW_VERSION -ExpectedVersion $env:CURRENT_VERSION
        "main_sha=$sha" >> $env:GITHUB_OUTPUT
  draft-release:
    name: Draft Release
    runs-on: ubuntu-latest
    needs: [prepare-metadata, package-exe, summarize-tests, sync-versions]
    if: |
      !cancelled() &&
      needs.prepare-metadata.result == 'success' &&
      needs.package-exe.result == 'success' &&
      needs.summarize-tests.result == 'success' &&
      (needs.prepare-metadata.outputs.has_plugin_update == 'true' || needs.sync-versions.result == 'success')

    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare-metadata.outputs.main_sha }}
        persist-credentials: false

    - name: Download package-exe
      uses: actions/download-artifact@v8.0.2
      with:
        name: package-exe
        path: dist/
    - name: Download component manifest
      uses: actions/download-artifact@v8.0.2
      with:
        name: app-comp-manifest
        path: dist/manifest/

    - name: Recheck release selection
      uses: actions/github-script@v7
      env:
        EXPECTED_MSSTORE: ${{ needs.prepare-metadata.outputs.msstore_enabled }}
        EXPECTED_SELECTION: ${{ needs.prepare-metadata.outputs.selection_labels }}
      with:
        script: |
          const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(context.payload.inputs.pr_number)});
          const selection = JSON.stringify(pr.labels.map(label => label.name).filter(name => name.startsWith('version:') || name.startsWith('update-plugin') || name === 'channel:msstore').sort());
          if (selection !== process.env.EXPECTED_SELECTION || !pr.merged || pr.merge_commit_sha !== '${{ needs.prepare-metadata.outputs.main_sha }}' ||
              pr.labels.some(label => label.name === 'channel:msstore') !== (process.env.EXPECTED_MSSTORE === 'true')) {
            throw new Error('Release PR/channel changed during this run.');
          }
    - name: Check release availability
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ needs.prepare-metadata.outputs.release_tag }}
        RELEASE_TITLE: ${{ needs.prepare-metadata.outputs.release_title }}
        TARGET_SHA: ${{ needs.sync-versions.outputs.main_sha || needs.prepare-metadata.outputs.main_sha }}
      run: |
        . ./.github/scripts/ReleaseMetadata.ps1
        Assert-ReleaseTagAvailable -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -AllowDraftRetry -ExpectedTitle $env:RELEASE_TITLE -TargetSha $env:TARGET_SHA

    - name: Create release draft
      id: release-draft
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.prepare-metadata.outputs.release_tag }}
        target_commitish: ${{ needs.sync-versions.outputs.main_sha || needs.prepare-metadata.outputs.main_sha }}
        name: ${{ needs.prepare-metadata.outputs.release_title }}
        body: ${{ needs.prepare-metadata.outputs.pr_body }}
        files: |
          dist/*.exe
          dist/SHA256.txt
          dist/manifest/*
          dist/plugins_patch.zip
          dist/PLUGINS_PATCH_SHS256.txt
        draft: true # 草稿状态，不对外公开，等待人工验证后发布
        make_latest: false # 草稿阶段不标记为最新，发布时再生效
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Summarize release
      if: always()
      shell: pwsh
      env:
        RELEASE_TITLE: ${{ needs.prepare-metadata.outputs.release_title }}
        RELEASE_TAG: ${{ needs.prepare-metadata.outputs.release_tag }}
        DRAFT_OUTCOME: ${{ steps.release-draft.outcome }}
        UI_OUTCOME: ${{ needs.summarize-tests.outputs.ui_outcome }}
        TARGET_SHA: ${{ needs.sync-versions.outputs.main_sha || needs.prepare-metadata.outputs.main_sha }}
      run: |
        @"
        ### $env:RELEASE_TITLE
        - Tag: $env:RELEASE_TAG
        - Commit: $env:TARGET_SHA
        - Draft: $env:DRAFT_OUTCOME
        - Installed EXE/MSIX UI acceptance: $env:UI_OUTCOME (required)
        "@ >> $env:GITHUB_STEP_SUMMARY
  draft-msstore:
    name: Draft Microsoft Store Submission
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: [prepare-metadata, package-msix, summarize-tests, sync-versions]
    if: |
      !cancelled() &&
      needs.prepare-metadata.result == 'success' &&
      needs.prepare-metadata.outputs.msstore_enabled == 'true' &&
      needs.package-msix.result == 'success' &&
      needs.summarize-tests.result == 'success' &&
      (needs.prepare-metadata.outputs.has_plugin_update == 'true' || needs.sync-versions.result == 'success')
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.prepare-metadata.outputs.main_sha }}
        persist-credentials: false
    - name: Download package-msix
      uses: actions/download-artifact@v8.0.2
      with:
        name: package-msix
        path: PackageArtifacts/msix
    - name: Recheck release selection
      uses: actions/github-script@v7
      env:
        EXPECTED_MSSTORE: ${{ needs.prepare-metadata.outputs.msstore_enabled }}
        EXPECTED_SELECTION: ${{ needs.prepare-metadata.outputs.selection_labels }}
      with:
        script: |
          const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(context.payload.inputs.pr_number)});
          const selection = JSON.stringify(pr.labels.map(label => label.name).filter(name => name.startsWith('version:') || name.startsWith('update-plugin') || name === 'channel:msstore').sort());
          if (selection !== process.env.EXPECTED_SELECTION || !pr.merged || pr.merge_commit_sha !== '${{ needs.prepare-metadata.outputs.main_sha }}' ||
              pr.labels.some(label => label.name === 'channel:msstore') !== (process.env.EXPECTED_MSSTORE === 'true')) {
            throw new Error('Release PR/channel changed during this run.');
          }
    - name: Create Partner Center draft
      shell: pwsh
      env:
        MSSTORE_APPLICATION_ID: ${{ vars.MSSTORE_APPLICATION_ID }}
        MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
        MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
        MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME }}
        MSSTORE_TENANT_ID: ${{ vars.MSSTORE_TENANT_ID }}
        MSSTORE_CLIENT_ID: ${{ vars.MSSTORE_CLIENT_ID }}
        MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        BUILD_NUMBER: ${{ needs.prepare-metadata.outputs.build_number }}
        SOURCE_SHA: ${{ needs.prepare-metadata.outputs.main_sha }}
      run: |
        ./.github/scripts/Invoke-StoreDraft.ps1 -Action Draft -BuildNumber $env:BUILD_NUMBER -SourceSha $env:SOURCE_SHA `
          -PackageArtifact PackageArtifacts/msix/package.json -ReportPath store-draft.json
    - name: Upload store-draft
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        overwrite: true
        name: store-draft
        path: store-draft.json
        if-no-files-found: warn
        retention-days: 30
  summarize-release:
    name: Release Draft Summary
    runs-on: ubuntu-latest
    needs: [prepare-metadata, summarize-tests, draft-release, draft-msstore]
    if: always() && needs.prepare-metadata.result == 'success'
    steps:
    - name: Summarize both draft channels
      env:
        MSIX_ENABLED: ${{ needs.prepare-metadata.outputs.msstore_enabled }}
        EXE_DRAFT: ${{ needs.draft-release.result }}
        STORE_DRAFT: ${{ needs.draft-msstore.result }}
        TEST_RESULT: ${{ needs.summarize-tests.result }}
      run: |
        $store = if ($env:MSIX_ENABLED -eq 'true') { $env:STORE_DRAFT } else { 'NotSelected' }
        "### Release drafts`n`n| Channel | Result |`n| --- | --- |`n| Acceptance | $env:TEST_RESULT |`n| GitHub EXE | $env:EXE_DRAFT |`n| Partner Center MSIX | $store |" >> $env:GITHUB_STEP_SUMMARY
        if ($env:TEST_RESULT -ne 'success' -or $env:EXE_DRAFT -ne 'success' -or
            ($env:MSIX_ENABLED -eq 'true' -and $env:STORE_DRAFT -ne 'success')) { throw 'Required release draft failed. Retry failed jobs in this run.' }
