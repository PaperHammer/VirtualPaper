syntax = "proto3";
package VirtualPaper.Grpc.Service.Commands;
import "google/protobuf/empty.proto";
import "Protos/common_models.proto";

service Grpc_CommandsService {
	rpc ShowUI (google.protobuf.Empty) returns (google.protobuf.Empty);
	rpc OpenProjects (Grpc_ProjectPaths) returns (google.protobuf.Empty);
	rpc GetActivationHost (google.protobuf.Empty) returns (Grpc_ActivationHost);
	rpc GetPendingProjectOpen (google.protobuf.Empty) returns (Grpc_ProjectOpenRequest);
	rpc CompleteProjectOpen (Grpc_ProjectOpenId) returns (google.protobuf.Empty);
	rpc CloseUI (google.protobuf.Empty) returns (google.protobuf.Empty);
	rpc NotifyUIClosing (Grpc_UIClosing) returns (google.protobuf.Empty);
	rpc RequestInstall (google.protobuf.Empty) returns (google.protobuf.Empty);
	rpc RestartUI (google.protobuf.Empty) returns (google.protobuf.Empty);
	rpc ShowDebugView (google.protobuf.Empty) returns (google.protobuf.Empty);
	rpc ShutDown (google.protobuf.Empty) returns (google.protobuf.Empty);
	rpc SubscribeUIRecievedCmd (google.protobuf.Empty) returns (stream VirtualPaper.Grpc.Service.CommonModels.Grpc_UIRecievedCmd);
}

message Grpc_UIClosing {
	int32 process_id = 1;
}

message Grpc_ProjectPaths {
	repeated string paths = 1;
}

message Grpc_ActivationHost {
	int32 process_id = 1;
}

message Grpc_ProjectOpenRequest {
	string id = 1;
	repeated string paths = 2;
}

message Grpc_ProjectOpenId {
	string id = 1;
}
