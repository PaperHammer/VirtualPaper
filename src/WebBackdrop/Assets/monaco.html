<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #1e1e1e;
        }
        #container { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="container"></div>

    <script src="monaco-editor/min/vs/loader.js"></script>
    <script>
        let editor;

        require.config({
            paths: { vs: 'monaco-editor/min/vs' }
        });

        require([
            'vs/editor/editor.main',
            'vs/language/html/monaco.contribution',
            'vs/language/css/monaco.contribution',
            'vs/language/typescript/monaco.contribution',
            'vs/basic-languages/monaco.contribution'
        ], function () {
            // Configure TS/JS with full intellisense
            monaco.languages.typescript.javascriptDefaults.setCompilerOptions({
                target: monaco.languages.typescript.ScriptTarget.ESNext,
                allowNonTsExtensions: true,
                allowJs: true,
                checkJs: true,
                lib: ['dom', 'esnext'],
                moduleResolution: monaco.languages.typescript.ModuleResolutionKind.NodeJs,
                jsx: monaco.languages.typescript.JsxEmit.React
            });
            monaco.languages.typescript.javascriptDefaults.setDiagnosticsOptions({
                noSemanticValidation: false,
                noSyntaxValidation: false,
                noSuggestionDiagnostics: false
            });
            monaco.languages.typescript.typescriptDefaults.setCompilerOptions({
                target: monaco.languages.typescript.ScriptTarget.ESNext,
                allowNonTsExtensions: true,
                allowJs: true,
                checkJs: true,
                moduleResolution: monaco.languages.typescript.ModuleResolutionKind.NodeJs,
                jsx: monaco.languages.typescript.JsxEmit.React,
                strict: true,
                strictNullChecks: true
            });

            // CSS diagnostics
            monaco.languages.css.cssDefaults.setDiagnosticsOptions({ validate: true });
            monaco.languages.css.lessDefaults.setDiagnosticsOptions({ validate: true });
            monaco.languages.css.scssDefaults.setDiagnosticsOptions({ validate: true });

            editor = monaco.editor.create(document.getElementById('container'), {
                value: '',
                language: 'plaintext',
                theme: window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'vs' : 'vs-dark',
                automaticLayout: true,

                minimap: { enabled: true, scale: 1, showSlider: 'mouseover' },
                fontSize: 14,
                lineNumbers: 'on',
                scrollBeyondLastLine: false,
                wordWrap: 'on',
                tabSize: 2,
                insertSpaces: true,
                detectIndentation: true,
                snippetSuggestions: 'top',

                // IntelliSense
                quickSuggestions: { other: true, comments: true, strings: true },
                suggestOnTriggerCharacters: true,
                acceptSuggestionOnCommitCharacter: true,
                acceptSuggestionOnEnter: 'on',
                tabCompletion: 'on',
                wordBasedSuggestions: 'currentDocument',
                parameterHints: { enabled: true, cycle: true },
                hover: { enabled: true, delay: 300 },
                occurrencesHighlight: 'singleFile',

                // Formatting
                formatOnPaste: true,
                formatOnType: true,

                // Brackets
                matchBrackets: 'always',
                autoClosingBrackets: 'always',
                autoClosingQuotes: 'always',
                autoClosingDelete: 'always',
                autoSurround: 'languageDefined',
                bracketPairColorization: { enabled: true },
                guides: { bracketPairs: true, indentation: true },
                colorDecorators: true,

                // General
                autoIndent: 'full',
                folding: true,
                foldingHighlight: true,
                showFoldingControls: 'always',
                links: true,
                cursorBlinking: 'smooth',
                cursorSmoothCaretAnimation: 'on',
                smoothScrolling: true,
                stickyScroll: { enabled: true },
                renderWhitespace: 'selection',
                semanticHighlighting: { enabled: true },
                copyWithSyntaxHighlighting: true,
                multiCursorModifier: 'alt',
            });

            // Initialize saved/initial version ids right after editor creation.
            // Without this, postEditorState() would report isSaved=false until the
            // first setValue() call, which can incorrectly mark non-text files
            // (e.g. the first opened image) as unsaved.
            var initialModel = editor.getModel();
            if (initialModel) {
                window.initialAlternativeVersionId = initialModel.getAlternativeVersionId();
                window.savedAlternativeVersionId = initialModel.getAlternativeVersionId();
            }

            function getLineEndingText(model) {
                return model && model.getEOL && model.getEOL() === '\r\n' ? 'CRLF' : 'LF';
            }

            function getIndentText(model) {
                if (!model) return 'Spaces: 2';

                var options = model.getOptions();
                return options.insertSpaces ? 'Spaces: ' + options.tabSize : 'Tabs: ' + options.tabSize;
            }

            var editorStateTimer = null;
            function postEditorState() {
                if (!window.chrome || !window.chrome.webview) {
                    return;
                }

                var model = editor.getModel();
                if (!model) {
                    return;
                }

                var alternativeVersionId = model.getAlternativeVersionId();
                window.chrome.webview.postMessage(JSON.stringify({
                    type: 'editorStateChanged',
                    alternativeVersionId: alternativeVersionId,
                    isSaved: alternativeVersionId === window.savedAlternativeVersionId,
                    canUndo: alternativeVersionId !== window.initialAlternativeVersionId,
                    canRedo: false,
                    lineEnding: getLineEndingText(model),
                    encoding: window.editorEncoding || 'UTF-8',
                    indent: getIndentText(model)
                }));
            }

            function scheduleEditorState() {
                if (editorStateTimer) clearTimeout(editorStateTimer);
                editorStateTimer = setTimeout(function () {
                    editorStateTimer = null;
                    postEditorState();
                }, 150);
            }

            var contentChangeTimer = null;
            editor.onDidChangeModelContent(function () {
                if (!window.isSettingValue) {
                    scheduleEditorState();
                }
                if (contentChangeTimer) clearTimeout(contentChangeTimer);
                contentChangeTimer = setTimeout(function () {
                    contentChangeTimer = null;
                    if (window.chrome && window.chrome.webview) {
                        window.chrome.webview.postMessage(JSON.stringify({ type: 'contentChange' }));
                    }
                }, 150);
            });

            var lastCursorPositionPayload = null;
            function postCursorPosition(position) {
                if (!window.chrome || !window.chrome.webview) {
                    return;
                }

                var model = editor.getModel();
                var currentPosition = position || editor.getPosition();
                if (!model || !currentPosition) {
                    return;
                }

                var selection = editor.getSelection();
                var selectedCharacterCount = selection ? model.getValueInRange(selection).length : 0;
                var payload = {
                    type: 'cursorPositionChange',
                    lineNumber: currentPosition.lineNumber,
                    column: currentPosition.column,
                    selectedCharacterCount: selectedCharacterCount
                };
                var serialized = JSON.stringify(payload);
                if (serialized === lastCursorPositionPayload) return;
                lastCursorPositionPayload = serialized;
                window.chrome.webview.postMessage(serialized);
            }

            editor.onDidChangeCursorPosition(function (e) {
                postCursorPosition(e.position);
            });

            editor.onDidChangeCursorSelection(function (e) {
                postCursorPosition(e.position || editor.getPosition());
            });

            // ======== Navigation History (Go Back / Go Forward) ========
            var navigationHistory = [];
            var navigationIndex = -1;
            var MAX_NAVIGATION_HISTORY = 50;
            var _navRecordTimer = null;
            var _lastNavRecorded = null;
            var NAV_RECORD_DELAY_MS = 300;
            var NAV_RECORD_MIN_LINE_DELTA = 3;

            function getCurrentFilePath() {
                var model = editor.getModel();
                if (!model || !model.uri || model.uri.scheme !== 'file') return null;
                var path = model.uri.fsPath;
                // Normalize Windows path (remove leading '/')
                if (path[0] === '/' && path[2] === ':') {
                    path = path.substring(1);
                }
                return path;
            }

            function pushNavigationPosition(filePath, lineNumber, column) {
                if (!filePath) return;
                var entry = { filePath: filePath, lineNumber: lineNumber, column: column };

                // Skip duplicate adjacent entries
                if (navigationIndex >= 0 && navigationIndex < navigationHistory.length) {
                    var current = navigationHistory[navigationIndex];
                    if (current.filePath === entry.filePath &&
                        current.lineNumber === entry.lineNumber) {
                        return;
                    }
                }

                // Truncate forward history when pushing after a back-navigation
                if (navigationIndex < navigationHistory.length - 1) {
                    navigationHistory = navigationHistory.slice(0, navigationIndex + 1);
                }

                navigationHistory.push(entry);
                if (navigationHistory.length > MAX_NAVIGATION_HISTORY) {
                    navigationHistory.shift();
                } else {
                    navigationIndex = navigationHistory.length - 1;
                }
            }

            function goBack() {
                if (navigationIndex <= 0) return;

                // Push current position at tip so we can come back via "goForward"
                var pos = editor.getPosition();
                var curPath = getCurrentFilePath();
                if (pos && curPath && navigationIndex === navigationHistory.length - 1) {
                    pushNavigationPosition(curPath, pos.lineNumber, pos.column);
                    // After push, index points to the just-added entry.
                    // Fall through to the decrement below.
                }

                // One step back: from mid-history, or from just-pushed tip entry
                navigationIndex = Math.max(0, navigationIndex - 1);

                var target = navigationHistory[navigationIndex];
                if (target) navigateToHistoryEntry(target);
            }

            function goForward() {
                if (navigationIndex >= navigationHistory.length - 1) return;

                navigationIndex++;
                var target = navigationHistory[navigationIndex];
                if (target) navigateToHistoryEntry(target);
            }

            function navigateToHistoryEntry(entry) {
                var currentPath = getCurrentFilePath();

                if (currentPath === entry.filePath) {
                    // Same file — navigate directly in editor
                    editor.setPosition({ lineNumber: entry.lineNumber, column: entry.column });
                    editor.revealPositionInCenter({ lineNumber: entry.lineNumber, column: entry.column });
                    editor.focus();
                } else {
                    // Try switching to an already-loaded Monaco model first (avoids C# roundtrip + flicker)
                    var normalizedPath = entry.filePath.replace(/\\/g, '/');
                    var targetUri = monaco.Uri.parse('file:///' + normalizedPath);
                    var existingModel = monaco.editor.getModel(targetUri);

                    if (existingModel) {
                        // Model cached — switch instantly in JS, no C# needed
                        editor.setModel(existingModel);
                        editor.setPosition({ lineNumber: entry.lineNumber, column: entry.column });
                        editor.revealPositionInCenter({ lineNumber: entry.lineNumber, column: entry.column });
                        editor.focus();
                        // Notify C# to sync UI (file tree, tab, etc.)
                        if (window.chrome && window.chrome.webview) {
                            window.chrome.webview.postMessage(JSON.stringify({
                                type: 'navigateBackForward',
                                filePath: entry.filePath
                            }));
                        }
                    } else {
                        // Model not yet loaded — let C# load the file;
                        // setValue() will apply the position after the new model is ready.
                        window._pendingNavigation = { lineNumber: entry.lineNumber, column: entry.column };
                        if (window.chrome && window.chrome.webview) {
                            window.chrome.webview.postMessage(JSON.stringify({
                                type: 'navigateBackForward',
                                filePath: entry.filePath
                            }));
                        }
                    }
                }
            }

            // Timeout-based cursor position recording:
            // Record the position after the cursor has been still for NAV_RECORD_DELAY_MS,
            // but only if it's sufficiently far from the last recorded position.
            function scheduleNavRecord() {
                if (_navRecordTimer) clearTimeout(_navRecordTimer);
                _navRecordTimer = setTimeout(function () {
                    _navRecordTimer = null;
                    var pos = editor.getPosition();
                    var filePath = getCurrentFilePath();
                    if (!pos || !filePath) return;

                    // Skip if too close to the last recorded position in the same file
                    if (_lastNavRecorded &&
                        _lastNavRecorded.filePath === filePath &&
                        Math.abs(pos.lineNumber - _lastNavRecorded.lineNumber) < NAV_RECORD_MIN_LINE_DELTA) {
                        return;
                    }

                    pushNavigationPosition(filePath, pos.lineNumber, pos.column);
                    _lastNavRecorded = { filePath: filePath, lineNumber: pos.lineNumber, column: pos.column };
                }, NAV_RECORD_DELAY_MS);
            }

            editor.onDidChangeCursorPosition(function (e) {
                scheduleNavRecord();
            });

            // Also record on mouse click (explicit navigation intent)
            editor.onMouseDown(function (e) {
                if (e.target.type === monaco.editor.MouseTargetType.CONTENT_TEXT ||
                    e.target.type === monaco.editor.MouseTargetType.GUTTER_LINE_NUMBERS) {
                    // Cancel pending timer and record the position BEFORE the click moves the cursor
                    if (_navRecordTimer) clearTimeout(_navRecordTimer);
                    _navRecordTimer = null;
                    // Schedule a fresh record for the new position after the click takes effect
                    setTimeout(function () {
                        var pos = editor.getPosition();
                        var filePath = getCurrentFilePath();
                        if (pos && filePath) {
                            if (!_lastNavRecorded ||
                                _lastNavRecorded.filePath !== filePath ||
                                Math.abs(pos.lineNumber - _lastNavRecorded.lineNumber) >= NAV_RECORD_MIN_LINE_DELTA) {
                                pushNavigationPosition(filePath, pos.lineNumber, pos.column);
                                _lastNavRecorded = { filePath: filePath, lineNumber: pos.lineNumber, column: pos.column };
                            }
                        }
                    }, 50);
                }
            });

            function postCurrentMarkers() {
                var model = editor.getModel();
                if (!model || !window.chrome || !window.chrome.webview) {
                    return;
                }

                window.chrome.webview.postMessage(JSON.stringify({
                    type: 'markersChanged',
                    markers: monaco.editor.getModelMarkers({ resource: model.uri }).map(function (marker) {
                        return {
                            severity: marker.severity,
                            message: marker.message,
                            startLineNumber: marker.startLineNumber,
                            startColumn: marker.startColumn,
                            endLineNumber: marker.endLineNumber,
                            endColumn: marker.endColumn,
                            source: marker.source || '',
                            code: marker.code ? String(marker.code.value || marker.code) : ''
                        };
                    })
                }));
            }

            monaco.editor.onDidChangeMarkers(function (uris) {
                var model = editor.getModel();
                if (!model || !uris.some(function (uri) { return uri.toString() === model.uri.toString(); })) {
                    return;
                }

                postCurrentMarkers();
            });

            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyB, function () {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({ type: 'shortcut', command: 'toggleLeftSideBar' }));
                }
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({ type: 'shortcut', command: 'save' }));
                }
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.KeyS, function () {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({ type: 'shortcut', command: 'saveAll' }));
                }
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyJ, function () {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({ type: 'shortcut', command: 'toggleBottomPanel' }));
                }
            });
            editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyMod.Alt | monaco.KeyCode.KeyB, function () {
                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({ type: 'shortcut', command: 'toggleRightSideBar' }));
                }
            });

            // ---- Block F1-F12 and browser shortcuts ----
            window.addEventListener('keydown', function (e) {
                var key = e.keyCode;
                var ctrl = e.ctrlKey;
                var shift = e.shiftKey;
                var alt = e.altKey;

                // F3-F11 (keep F1=Help, F2=Rename)
                if (key >= 114 && key <= 122) { e.preventDefault(); e.stopPropagation(); return; }
                // F12: block browser DevTools but let Monaco handle Go to Definition
                if (key === 123) { e.preventDefault(); return; }
                // F5 / Ctrl+R (Refresh)
                if (key === 116 || (ctrl && key === 82)) { e.preventDefault(); e.stopPropagation(); return; }
                // Ctrl+Shift+I/J (DevTools)
                if (ctrl && shift && (key === 73 || key === 74)) { e.preventDefault(); e.stopPropagation(); return; }
                // Ctrl+U (View Source)
                if (ctrl && key === 85) { e.preventDefault(); e.stopPropagation(); return; }
                // Ctrl+N (New Window), Ctrl+T (New Tab), Ctrl+W (Close Tab)
                if (ctrl && (key === 78 || key === 84 || key === 87)) { e.preventDefault(); e.stopPropagation(); return; }
                // Ctrl+Shift+N (Incognito), Ctrl+Shift+T (Reopen Tab)
                if (ctrl && shift && (key === 78 || key === 84)) { e.preventDefault(); e.stopPropagation(); return; }
                // Ctrl+H (History / Replace — let Monaco handle Replace)
                if (ctrl && !shift && key === 72) { e.preventDefault(); e.stopPropagation(); return; }
                // Ctrl+G / Ctrl+Shift+G (Find Next/Prev in browser — Monaco has own)
                if (ctrl && (key === 71)) { e.preventDefault(); e.stopPropagation(); return; }
                // Alt+Left / Alt+Right (Go Back / Go Forward — VS Code style)
                if (alt && !ctrl && !shift && key === 37) { e.preventDefault(); e.stopPropagation(); goBack(); return; }
                if (alt && !ctrl && !shift && key === 39) { e.preventDefault(); e.stopPropagation(); goForward(); return; }
                // Ctrl+Alt+- (Go Back)
                if (ctrl && alt && !shift && key === 189) { e.preventDefault(); e.stopPropagation(); goBack(); return; }
                // Ctrl+Shift+- (Go Forward)
                if (ctrl && !alt && shift && key === 189) { e.preventDefault(); e.stopPropagation(); goForward(); return; }
                // Ctrl+D (Bookmark)
                if (ctrl && key === 68) { e.preventDefault(); e.stopPropagation(); return; }
            }, true);

            // ---- Mouse side buttons for Go Back / Go Forward ----
            window.addEventListener('mouseup', function (e) {
                // XButton1 (browser back)  → Go Back
                // XButton2 (browser forward) → Go Forward
                if (e.button === 3) { e.preventDefault(); e.stopPropagation(); goBack(); return; }
                if (e.button === 4) { e.preventDefault(); e.stopPropagation(); goForward(); return; }
            }, true);

            // ---- Ctrl+Click file navigation ----
            // Intercept Ctrl+Click on any word; if it looks like a relative file
            // path, resolve it against the current model URI and open it via C#.
            editor.onMouseDown(function (e) {
                if (!e.event.ctrlKey && !e.event.metaKey) return;
                if (e.target.type !== monaco.editor.MouseTargetType.CONTENT_TEXT) return;
                if (!e.target.position) return;

                var model = editor.getModel();
                if (!model) return;
                var modelUri = model.uri;
                if (!modelUri || modelUri.scheme !== 'file') return;

                // Get the word at click position
                var word = model.getWordAtPosition(e.target.position);
                if (!word) return;
                var clickedText = word.word;

                // Always try to find the full quoted path first (e.g. "js/script.js"
                // vs just "script.js" returned by getWordAtPosition)
                var lineContent = model.getLineContent(e.target.position.lineNumber);
                var col = e.target.position.column - 1; // 0-based
                var quoteMatch = findQuotedPathAt(lineContent, col);
                if (quoteMatch) {
                    clickedText = quoteMatch;
                } else if (!/\.(js|ts|mjs|cjs|css|scss|less|html|htm|json|xml|svg|png|jpg|jpeg|gif|webp|ico|md|txt)$/i.test(clickedText)) {
                    // Word doesn't have a known extension and not inside a quoted path → ignore
                    return;
                }

                // Resolve relative to model URI directory
                var dir = monaco.Uri.parse(modelUri.toString().replace(/\/[^/]+$/, ''));
                var resolved = monaco.Uri.joinPath(dir, clickedText);
                var path = resolved.path;

                // Normalize Windows path (remove leading '/')
                if (path[0] === '/' && path[2] === ':') {
                    path = path.substring(1);
                }

                // Push current position to history before navigating away
                var curPos = editor.getPosition();
                if (curPos) {
                    pushNavigationPosition(getCurrentFilePath(), curPos.lineNumber, curPos.column);
                }

                if (window.chrome && window.chrome.webview) {
                    window.chrome.webview.postMessage(JSON.stringify({
                        type: 'openFile',
                        filePath: path
                    }));
                }
                e.event.preventDefault();
            });

            // Find a file path inside quotes at the given column
            function findQuotedPathAt(line, col) {
                var matches = line.matchAll(/(['"])((?:(?!\1).)+\.(?:js|ts|mjs|cjs|css|scss|less|html|htm|json|xml|svg|png|jpg|jpeg|gif|webp|ico|md|txt))\1/gi);
                for (var m of matches) {
                    var start = m.index + 1; // after opening quote
                    var end = start + m[2].length;
                    if (col >= start && col < end) {
                        return m[2];
                    }
                }
                return null;
            }

            function updateLargeFileOptions(contentLength) {
                var isLargeFile = contentLength >= 200000;
                editor.updateOptions({
                    minimap: { enabled: !isLargeFile, scale: 1, showSlider: 'mouseover' },
                    folding: !isLargeFile,
                    stickyScroll: { enabled: !isLargeFile },
                    smoothScrolling: !isLargeFile,
                    cursorSmoothCaretAnimation: isLargeFile ? 'off' : 'on',
                    semanticHighlighting: { enabled: !isLargeFile },
                    occurrencesHighlight: isLargeFile ? 'off' : 'singleFile',
                    colorDecorators: !isLargeFile,
                    bracketPairColorization: { enabled: !isLargeFile }
                });
            }

            window.setValue = function (value, filePath) {
                updateLargeFileOptions(value.length);
                var current = editor.getValue();
                var isChanged = current !== value;
                if (isChanged) {
                    window.isSettingValue = true;

                    // Record current position before switching to a different file
                    var currentPath = getCurrentFilePath();
                    var currentPos = editor.getPosition();
                    if (filePath && currentPath && currentPath !== filePath && currentPos) {
                        pushNavigationPosition(currentPath, currentPos.lineNumber, currentPos.column);
                    }

                    if (filePath) {
                        var normalizedPath = filePath.replace(/\\/g, '/');
                        var uri = monaco.Uri.parse('file:///' + normalizedPath);
                        var existingModel = monaco.editor.getModel(uri);
                        if (existingModel) {
                            existingModel.setValue(value);
                        } else {
                            existingModel = monaco.editor.createModel(value, undefined, uri);
                        }
                        editor.setModel(existingModel);
                    } else {
                        editor.setValue(value);
                    }
                }
                var model = editor.getModel();
                if (model) {
                    window.initialAlternativeVersionId = model.getAlternativeVersionId();
                    window.savedAlternativeVersionId = model.getAlternativeVersionId();
                }
                window.isSettingValue = false;

                // Apply pending navigation position (from goBack/goForward cross-file)
                if (window._pendingNavigation) {
                    var nav = window._pendingNavigation;
                    window._pendingNavigation = null;
                    editor.setPosition({ lineNumber: nav.lineNumber, column: nav.column });
                    editor.revealPositionInCenter({ lineNumber: nav.lineNumber, column: nav.column });
                    editor.focus();
                }

                postEditorState();
            };

            window.markSaved = function () {
                var model = editor.getModel();
                if (!model) {
                    return;
                }

                window.savedAlternativeVersionId = model.getAlternativeVersionId();
                postEditorState();
            };

            // Register project files so TS service can resolve cross-file imports
            window.registerExtraLibs = function (filesJson) {
                try {
                    var files = JSON.parse(filesJson);
                    var defaults = monaco.languages.typescript.javascriptDefaults;
                    files.forEach(function (file) {
                        try {
                            defaults.addExtraLib(file.content, 'file:///' + file.path);
                        } catch (e) {
                            // Ignore individual file registration failures
                        }
                    });
                } catch (e) {
                    // Ignore parse failures
                }
            };

            window.undo = function () {
                editor.trigger('host', 'undo', null);
            };

            window.redo = function () {
                editor.trigger('host', 'redo', null);
            };

            window.getEditorState = function () {
                var model = editor.getModel();
                if (!model) {
                    return JSON.stringify({
                        alternativeVersionId: 0,
                        isSaved: true,
                        canUndo: false,
                        canRedo: false,
                        lineEnding: 'LF',
                        encoding: window.editorEncoding || 'UTF-8',
                        indent: 'Spaces: 2'
                    });
                }

                var alternativeVersionId = model.getAlternativeVersionId();
                return JSON.stringify({
                    alternativeVersionId: alternativeVersionId,
                    isSaved: alternativeVersionId === window.savedAlternativeVersionId,
                    canUndo: alternativeVersionId !== window.initialAlternativeVersionId,
                    canRedo: false,
                    lineEnding: getLineEndingText(model),
                    encoding: window.editorEncoding || 'UTF-8',
                    indent: getIndentText(model)
                });
            };

            window.getValue = function () {
                return editor.getValue();
            };

            window.revealPosition = function (lineNumber, column) {
                editor.setPosition({ lineNumber: lineNumber, column: column });
                editor.revealPositionInCenter({ lineNumber: lineNumber, column: column });
                editor.focus();
            };

            window.setEditorTheme = function (theme) {
                monaco.editor.setTheme(theme);
                document.documentElement.dataset.theme = theme;
                document.body.style.background = theme === 'vs' ? '#ffffff' : '#1e1e1e';
            };

            window.setLanguage = function (language) {
                var model = editor.getModel();
                if (model) {
                    monaco.editor.setModelLanguage(model, language);
                }
            };

            function createSnippetProvider(snippets) {
                return {
                    triggerCharacters: ['!', '.', '#', ':'],
                    provideCompletionItems: function (model, position) {
                        var text = model.getValueInRange({
                            startLineNumber: position.lineNumber,
                            startColumn: 1,
                            endLineNumber: position.lineNumber,
                            endColumn: position.column
                        });
                        var match = text.match(/[!a-zA-Z0-9._:-]+$/);
                        var startColumn = match ? position.column - match[0].length : position.column;
                        var range = {
                            startLineNumber: position.lineNumber,
                            endLineNumber: position.lineNumber,
                            startColumn: startColumn,
                            endColumn: position.column
                        };
                        return {
                            suggestions: snippets.map(function (snippet) {
                                return {
                                    label: snippet.label,
                                    kind: monaco.languages.CompletionItemKind.Snippet,
                                    insertText: snippet.insertText,
                                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                                    detail: snippet.detail,
                                    range: range
                                };
                            })
                        };
                    }
                };
            }

            monaco.languages.registerCompletionItemProvider('html', createSnippetProvider([
                { label: '!', detail: 'DOCTYPE declaration', insertText: '<!DOCTYPE html>' },
                { label: '!!!', detail: 'HTML5 document', insertText: '<!DOCTYPE html>\n<html lang="en">\n<head>\n\t<meta charset="UTF-8">\n\t<meta name="viewport" content="width=device-width, initial-scale=1.0">\n\t<title>${1:Document}</title>\n</head>\n<body>\n\t$0\n</body>\n</html>' },
                { label: 'meta:vp', detail: 'Viewport meta', insertText: '<meta name="viewport" content="width=device-width, initial-scale=1.0">' },
                { label: 'link:css', detail: 'Stylesheet link', insertText: '<link rel="stylesheet" href="${1:style.css}">' },
                { label: 'script:src', detail: 'Script source', insertText: '<script src="${1:script.js}"><\/script>' },
                { label: 'div', detail: 'Div with class', insertText: '<div class="${1:container}">\n\t$0\n</div>' },
                { label: 'btn', detail: 'Button', insertText: '<button type="button" class="${1:btn}">$0</button>' },
                { label: 'input', detail: 'Input', insertText: '<input type="${1:text}" name="${2:name}" placeholder="${3:placeholder}">' },
                { label: 'img', detail: 'Image', insertText: '<img src="${1:image.png}" alt="${2:description}">' },
                { label: 'ul', detail: 'List', insertText: '<ul>\n\t<li>${1:item}</li>\n\t<li>${2:item}</li>\n</ul>' }
            ]));

            monaco.languages.registerCompletionItemProvider('css', createSnippetProvider([
                { label: 'reset', detail: 'CSS reset', insertText: '* {\n\tbox-sizing: border-box;\n}\n\nhtml, body {\n\tmargin: 0;\n\tpadding: 0;\n\twidth: 100%;\n\theight: 100%;\n}' },
                { label: 'center', detail: 'Flex center', insertText: 'display: flex;\nalign-items: center;\njustify-content: center;' },
                { label: 'flex', detail: 'Flex row', insertText: 'display: flex;\ngap: ${1:16px};\nalign-items: center;' },
                { label: 'grid', detail: 'Responsive grid', insertText: 'display: grid;\ngrid-template-columns: repeat(${1:auto-fit}, minmax(${2:240px}, 1fr));\ngap: ${3:16px};' },
                { label: 'abs', detail: 'Absolute fill', insertText: 'position: absolute;\ninset: 0;' },
                { label: 'media', detail: 'Media query', insertText: '@media (max-width: ${1:768px}) {\n\t$0\n}' },
                { label: 'anim', detail: 'Keyframes animation', insertText: 'animation: ${1:fadeIn} ${2:300ms} ease ${3:both};\n\n@keyframes ${1:fadeIn} {\n\tfrom { opacity: 0; }\n\tto { opacity: 1; }\n}' }
            ]));

            monaco.languages.registerCompletionItemProvider('javascript', createSnippetProvider([
                { label: 'fn', detail: 'Function declaration', insertText: 'function ${1:name}(${2:params}) {\n\t$0\n}' },
                { label: 'afn', detail: 'Arrow function', insertText: 'const ${1:name} = (${2:params}) => {\n\t$0\n};' },
                { label: 'log', detail: 'Console log', insertText: 'console.log(${1:value});' },
                { label: 'event', detail: 'Event listener', insertText: '${1:element}.addEventListener(\'${2:click}\', (${3:event}) => {\n\t$0\n});' },
                { label: 'fetch', detail: 'Fetch async', insertText: 'const response = await fetch(\'${1:url}\');\nconst data = await response.json();\n$0' },
                { label: 'try', detail: 'Try catch', insertText: 'try {\n\t$0\n} catch (error) {\n\tconsole.error(error);\n}' },
                { label: 'raf', detail: 'requestAnimationFrame loop', insertText: 'function ${1:tick}(${2:time}) {\n\t$0\n\trequestAnimationFrame(${1:tick});\n}\nrequestAnimationFrame(${1:tick});' }
            ]));

            monaco.languages.registerCompletionItemProvider('typescript', createSnippetProvider([
                { label: 'interface', detail: 'Interface', insertText: 'interface ${1:Name} {\n\t${2:property}: ${3:string};\n}' },
                { label: 'type', detail: 'Type alias', insertText: 'type ${1:Name} = {\n\t${2:property}: ${3:string};\n};' },
                { label: 'class', detail: 'Class', insertText: 'class ${1:Name} {\n\tconstructor(${2}) {\n\t\t$0\n\t}\n}' },
                { label: 'async', detail: 'Async function', insertText: 'async function ${1:name}(${2:params}): Promise<${3:void}> {\n\t$0\n}' }
            ]));

            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(JSON.stringify({ type: 'ready' }));
            }

            window.formatDocument = function () {
                editor.getAction('editor.action.formatDocument').run();
            };

            window.setEncoding = function (encoding) {
                window.editorEncoding = encoding || 'UTF-8';
                postEditorState();
            };

            window.setIndentOptions = function (newTabSize, newInsertSpaces) {
                editor.updateOptions({
                    tabSize: newTabSize,
                    indentSize: newInsertSpaces ? newTabSize : 'tabSize',
                    insertSpaces: newInsertSpaces,
                    detectIndentation: false
                });

                var model = editor.getModel();
                if (model) {
                    model.updateOptions({
                        tabSize: newTabSize,
                        indentSize: newInsertSpaces ? newTabSize : 'tabSize',
                        insertSpaces: newInsertSpaces
                    });
                }
                postEditorState();
            };

            window.getIndentOptions = function () {
                var options = editor.getOptions();
                var model = editor.getModel();
                var tabSize = model ? model.getOptions().tabSize : options.get(monaco.editor.EditorOption.tabSize);
                var insertSpaces = model ? model.getOptions().insertSpaces : options.get(monaco.editor.EditorOption.insertSpaces);
                return JSON.stringify({
                    tabSize: tabSize,
                    insertSpaces: insertSpaces
                });
            };
            window.replaceLineEndings = function (targetEnding) {
                var model = editor.getModel();
                if (!model) return;
                if (model.getEOL() === targetEnding) return;

                model.pushEOL(targetEnding === '\r\n'
                    ? monaco.editor.EndOfLineSequence.CRLF
                    : monaco.editor.EndOfLineSequence.LF);
            };
        });
    </script>
</body>
</html>
