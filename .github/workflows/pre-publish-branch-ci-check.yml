    - name: Run UI Tests
      run: dotnet test src/VirtualPaper.UI.Test/VirtualPaper.UI.Test.csproj --configuration Release --no-build --verbosity normal --settings src/test.runsettings --logger "trx;LogFileName=ui-tests.trx" --results-directory TestResults/UI
      shell: pwsh

    - name: Verify test results exist
      run: |
