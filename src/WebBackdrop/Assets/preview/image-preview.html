<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: var(--preview-background);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
    <script>
        document.documentElement.style.setProperty('--preview-background', '{{PreviewBackground}}');
    </script>
</head>
<body>
    <img src="{{ImageUri}}">
</body>
</html>
