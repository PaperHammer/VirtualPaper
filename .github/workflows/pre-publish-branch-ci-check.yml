name: Pre-publish Branch CI Check
run-name: "[Auto] CI Check | ${{ github.ref_name }} | ${{ github.event.head_commit.message || github.event.pull_request.title }}"

on:
  push:
    branches:
      - dev
      - release
      - bugfix
  pull_request:
    branches:
      - dev
      - release
      - bugfix

concurrency:
  group: pre-publish-branch-ci-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build Solution
    runs-on: windows-latest
    # push 事件：跳过含 [skip ci] 的 commit
    # pull_request 事件：跳过标题或正文含 [skip ci] 的 PR
    if: |
      (github.event_name == 'pull_request' &&
       !contains(github.event.pull_request.title, '[skip ci]')) ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[skip ci]'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate test workflow wiring
      shell: pwsh
      run: ./.github/scripts/validate-test-workflow.ps1

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/**/*.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Build solution
      # 使用 msbuild 而非 dotnet build，确保 .sln 的 Platform Mapping 生效：
      # VirtualPaper.UI（WinAppSDK）在 .sln 中映射为 Release|x64，
      # dotnet build 不读取此映射，msbuild 才能正确路由到 x64 构建。
      # 与 auto-version-release.yml 保持工具链一致。
      run: msbuild src/VirtualPaper.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /restore /m

    - name: Upload build output
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        retention-days: 7
        path: src/

  # Test phases are sequential: installer smoke -> parallel regular tests -> real UI.
  smoke-test:
    name: Install, Launch and Uninstall
    runs-on: windows-latest
    needs: build
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: src/

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Install Inno Setup 6.7.1
      shell: pwsh
      run: choco install innosetup --version=6.7.1 --no-progress -y

    - name: Compile installer
      shell: pwsh
      run: |
        & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" InnoSetup/setup.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Install, launch and uninstall
      shell: pwsh
      run: |
        $installers = @(Get-ChildItem -LiteralPath InnoSetup/Output -Filter '*.exe' -File)
        if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
        ./test/Run-SmokeTests.ps1 -InstallerPath $installers[0].FullName -NoBuild -ReportPath TestResults/Smoke/smoke-results.json

    - name: Upload smoke test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-smoke
        path: TestResults/Smoke/
        if-no-files-found: warn
        retention-days: 7

  test-release-build:
    name: Build Artifact Tests
    runs-on: windows-latest
    needs: [build, smoke-test]

    steps:
    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: src/

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/**/*.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Validate Build Artifacts
      # 在产物就地校验：主 exe / Plugin exe / 核心 dll 存在且非空。
      # 与七个常规项目并行，失败同样阻断真实 UI 阶段。
      env:
        RELEASE_BIN_DIR: ${{ github.workspace }}/src/VirtualPaper/bin/Release/net8.0-windows10.0.19041.0
      run: dotnet test src/VirtualPaper.ReleaseBuildData.Test/VirtualPaper.ReleaseBuildData.Test.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=release-build-tests.trx" --results-directory TestResults/ReleaseBuild
      shell: pwsh

    - name: Upload Validate Build Artifacts results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-release-build
        path: TestResults/ReleaseBuild/
        retention-days: 7

