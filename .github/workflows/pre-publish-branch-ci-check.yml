  test-ui-operation:
    name: WinUI Operation Tests
    runs-on: windows-latest
    needs: [build, smoke-test, test-release-build, test-core, test-ui, test-static-img, test-web-backdrop, test-ui-component, test-ml, test-shader]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build output
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: src/

    - name: Download prerequisite test results
      uses: actions/download-artifact@v4
      with:
        pattern: test-results-*
        path: PrerequisiteTestResults/

    - name: Verify prerequisite test host health
      shell: pwsh
      run: |
        $reports = @(Get-ChildItem -LiteralPath PrerequisiteTestResults -Filter '*.trx' -Recurse)
        if ($reports.Count -ne 8) { throw 'Expected the seven regular test reports plus build artifact validation.' }
        foreach ($file in $reports) {
          [xml]$report = Get-Content -LiteralPath $file.FullName -Raw
          $summary = $report.TestRun.ResultSummary
          $output = [string]$summary.Output.StdOut + [string]$summary.Output.StdErr
          if ([int]$summary.Counters.failed -gt 0 -or [int]$summary.Counters.aborted -gt 0 -or
              $output -match '(?im)^Unhandled exception\.') {
            throw "Test host did not finish cleanly: $($file.FullName)"
          }
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'test/**/*.csproj', 'src/**/*.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Run real WinUI interaction tests
      shell: pwsh
      run: ./test/Run-UIOperationTests.ps1 -Configuration Release -ReportPath TestResults/UIOperation/ui-operation-results.json

    - name: Upload WinUI operation results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-ui-operation
        path: TestResults/UIOperation/
        if-no-files-found: error
        retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [build, smoke-test, test-release-build, test-core, test-ui, test-static-img, test-web-backdrop, test-ui-component, test-ml, test-shader, test-ui-operation]
    # build 被 skip（[skip ci]）或任意 job 被 cancel 时，整条链跳过
    if: |
      always() &&
      needs.build.result != 'skipped' &&
      !contains(needs.*.result, 'cancelled')
    
    steps:
    - name: Checkout report validation code
      uses: actions/checkout@v4

    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        pattern: test-results-*
        path: TestResults/

    - name: Verify all test results
      run: |
        echo "=== Checking test result files ==="
        EXPECTED_FILES=("core-tests.trx" "ui-tests.trx" "static-img-tests.trx" "web-backdrop-tests.trx" "ui-component-tests.trx" "ml-tests.trx" "shader-tests.trx" "release-build-tests.trx")
        MISSING=0
        
        for file in "${EXPECTED_FILES[@]}"; do
          FOUND=$(find TestResults/ -name "$file" 2>/dev/null)
          if [ -z "$FOUND" ]; then
            echo -e "\033[0;31m[MISSING]\033[0m $file"
            MISSING=$((MISSING + 1))
          else
            echo -e "\033[0;32m[FOUND]\033[0m $FOUND"
          fi
        done
        
        if [ $MISSING -gt 0 ]; then
          echo ""
          echo -e "\033[0;31m[ERROR]\033[0m $MISSING test result file(s) missing!"
          echo "TEST_RESULTS_VALID=false" >> $GITHUB_ENV
        else
          echo ""
          echo -e "\033[0;32m[OK]\033[0m All test result files present"
          echo "TEST_RESULTS_VALID=true" >> $GITHUB_ENV
        fi

    - name: Verify installer smoke results
      shell: pwsh
      run: |
        . ./test/SmokeTestSupport.ps1
        $report = Get-Content -LiteralPath TestResults/test-results-smoke/smoke-results.json -Raw | ConvertFrom-Json
        Assert-SmokeReportPassed $report
        'SMOKE_RESULTS_VALID=true' >> $env:GITHUB_ENV

    - name: Verify WinUI operation results
      shell: pwsh
      run: |
        . ./test/UIOperationTestSupport.ps1
        $path = 'TestResults/test-results-ui-operation/ui-operation-results.json'
        if (-not (Test-Path -LiteralPath $path)) { throw 'WinUI operation report is missing.' }
        $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
        $outcome = Get-UIOperationReportOutcome $report
        '### WinUI operation tests' >> $env:GITHUB_STEP_SUMMARY
        if ($outcome -eq 'Skipped') {
          "- **Skipped** [$($report.SkipReason)]: $($report.Environment.Reason)" >> $env:GITHUB_STEP_SUMMARY
          '- No real UI acceptance was executed; this is not a passing UI result.' >> $env:GITHUB_STEP_SUMMARY
        } else {
          foreach ($result in $report.Results) {
            "- $($result.Name): passed=$($result.Passed), $($result.DurationMilliseconds) ms" >> $env:GITHUB_STEP_SUMMARY
          }
        }
        'UI_OPERATION_RESULTS_VALID=true' >> $env:GITHUB_ENV
        "UI_OPERATION_OUTCOME=$outcome" >> $env:GITHUB_ENV

    - name: Summarize code coverage
      shell: pwsh
      run: |
          # Microsoft.Testing.Platform also stages each attachment under an In directory.
          # Keep one canonical copy per project so coverage is not counted twice.
          $coverageFiles = @(
            Get-ChildItem -LiteralPath "TestResults" -Filter "*.cobertura.xml" -Recurse |
              Where-Object { $_.FullName -notmatch '[\\/]In[\\/]' }
          )
          if ($coverageFiles.Count -ne 7) {
            Write-Error "Expected 7 Cobertura reports, found $($coverageFiles.Count)."
            exit 1
          }
          $covered = 0L
          $valid = 0L
          $rows = @()
          $resultsRoot = (Resolve-Path -LiteralPath "TestResults").Path
          foreach ($file in $coverageFiles) {
            [xml]$report = Get-Content -LiteralPath $file.FullName -Raw
            $projectCovered = [long]$report.coverage.'lines-covered'
            $projectValid = [long]$report.coverage.'lines-valid'
            $projectRate = if ($projectValid -eq 0) { 0 } else { [math]::Round(100 * $projectCovered / $projectValid, 2) }
            $relativePath = [IO.Path]::GetRelativePath($resultsRoot, $file.FullName)
            $artifactDirectory = [regex]::Split($relativePath, '[\\/]')[0]
            $project = $artifactDirectory -replace '^test-results-', ''
            $rows += "| $project | $projectCovered / $projectValid | $projectRate% |"
            $covered += $projectCovered
            $valid += $projectValid
          }
          $rate = if ($valid -eq 0) { 0 } else { [math]::Round(100 * $covered / $valid, 2) }
          $summary = @(
            "### Code coverage",
            "",
            "| Project | Lines | Coverage |",
            "| --- | ---: | ---: |"
          ) + ($rows | Sort-Object) + @(
            "",
            "**Combined:** $covered / $valid lines covered (**$rate%**) across 7 regular test projects."
          )
          $summary -join "`n" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Combined line coverage: $covered / $valid ($rate%)"

    - name: Upload combined test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-combined-${{ github.sha }}
        path: TestResults/
        retention-days: 30

    - name: Set test status
      if: always()
      run: |
        # 用通配方式判断：只要 needs 里任意 job 非 success 且非 skipped，就标记失败。
        # 新增测试 job 时只需更新 needs 列表，无需修改此处逻辑。
        ALL_RESULTS="${{ join(needs.*.result, ' ') }}"
        echo "Job results: $ALL_RESULTS"

        if echo "$ALL_RESULTS" | grep -qE 'failure|cancelled' || [ "${SMOKE_RESULTS_VALID:-false}" != "true" ] || [ "${TEST_RESULTS_VALID:-false}" != "true" ] || [ "${UI_OPERATION_RESULTS_VALID:-false}" != "true" ]; then
          echo "TEST_STATUS=failure" >> $GITHUB_ENV
          echo "TEST_DESCRIPTION=Some tests failed or results missing [FAILED]" >> $GITHUB_ENV
        else
          echo "TEST_STATUS=success" >> $GITHUB_ENV
          if [ "${UI_OPERATION_OUTCOME:-}" = "Skipped" ]; then
            echo "TEST_DESCRIPTION=Regular tests passed; WinUI skipped [SKIPPED]" >> $GITHUB_ENV
          else
            echo "TEST_DESCRIPTION=All tests passed [OK]" >> $GITHUB_ENV
          fi
        fi

    - name: Create Status Check
      if: always()
      uses: actions/github-script@v7
      with:
        script: |
          const branch = context.ref.replace('refs/heads/', '') || context.payload.pull_request?.head?.ref || 'unknown';
          const state = process.env.TEST_STATUS || 'failure';
          const description = process.env.TEST_DESCRIPTION || 'Tests failed';
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: state,
            target_url: `${context.payload.repository.html_url}/actions/runs/${context.runId}`,
            description: `[${branch}] ${description}`,
            context: 'ci-check/pre-publish-tests'
          });
