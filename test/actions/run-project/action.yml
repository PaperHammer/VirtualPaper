name: Run project tests
description: Run a prebuilt test project, validate its TRX report and upload the results.
inputs:
  job-id:
    description: Test job identifier from TestReportSupport.ps1
    required: true
  include-ml-integration:
    description: Include real ML inference tests
    required: false
    default: 'false'
  require-complete-execution:
    description: Reject skipped project tests for release acceptance
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - name: Set up .NET
    uses: actions/setup-dotnet@v6.1.0
    with:
      dotnet-version: 8.0.x
  - name: Cache NuGet packages
    uses: actions/cache@v6.1.0
    with:
      path: ~/.nuget/packages
      key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'test/**/*.csproj', 'src/**/*.props') }}
      restore-keys: nuget-${{ runner.os }}-
  - name: Run and validate tests
    id: tests
    shell: pwsh
    env:
      TEST_JOB_ID: ${{ inputs.job-id }}
      INCLUDE_ML_INTEGRATION: ${{ inputs.include-ml-integration }}
      REQUIRE_COMPLETE_EXECUTION: ${{ inputs.require-complete-execution }}
    run: ./test/Run-ProjectTests.ps1 -JobId $env:TEST_JOB_ID -IncludeMLIntegration:($env:INCLUDE_ML_INTEGRATION -eq 'true') -RequireCompleteExecution:($env:REQUIRE_COMPLETE_EXECUTION -eq 'true')
  - name: Upload test results
    if: always() && steps.tests.outputs.results_directory != ''
    uses: actions/upload-artifact@v7.0.2
    with:
      name: ${{ steps.tests.outputs.artifact }}
      path: ${{ steps.tests.outputs.results_directory }}/
      overwrite: true
      if-no-files-found: error
      retention-days: 7
