<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <title data-i18n="template.title">Interactive Glow</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <canvas id="wallpaper"></canvas>
    <main class="hud" aria-label="Wallpaper information">

        <p id="time">00:00</p>
        <p class="hint" data-i18n="template.hint">Move the mouse or click to create glowing streams</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
