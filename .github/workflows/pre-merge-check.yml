name: Pre-merge Check
run-name: "[Manual] Pre-merge Check | PR #${{ inputs.pr_number }}"

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number (target: dev or main)'
        required: true
        type: number
      include_ml_integration:
        description: 'Also run real model inference tests (requires local model files)'
        required: false
        type: boolean
        default: false

concurrency:
  group: pre-merge-check-${{ inputs.pr_number }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

permissions:
  contents: read

jobs:
  validate-pr:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
      test_sha: ${{ steps.pr.outputs.test_sha }}
      base_sha: ${{ steps.pr.outputs.base_sha }}
      msstore_enabled: ${{ steps.pr.outputs.msstore_enabled }}
      version_label: ${{ steps.pr.outputs.version_label }}
    steps:
    - name: Check PR rules and snapshot
      id: pr
      uses: actions/github-script@v7
      with:
        script: |
          const number = Number(context.payload.inputs.pr_number);
          if (!Number.isSafeInteger(number) || number <= 0) throw new Error('Enter a positive PR number.');
          const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
          core.setOutput('head_sha', pr.head.sha);
          core.setOutput('msstore_enabled', pr.labels.some(label => label.name === 'channel:msstore').toString());
          const status = state => github.rest.repos.createCommitStatus({
            ...context.repo, sha: pr.head.sha, context: 'pre-merge-check', state,
            description: state === 'pending' ? 'Manual pre-merge checks are running' : 'PR policy validation failed',
            target_url: `${context.payload.repository.html_url}/actions/runs/${context.runId}`
          });
          // Do not write statuses for a fork. Same-repository PRs are the supported release path.
          if (pr.head.repo?.full_name !== context.payload.repository.full_name) throw new Error('Only same-repository PRs are supported.');
          if (pr.state !== 'open') throw new Error('Pre-merge Check requires an open PR.');
          await status('pending');
          try {
            const base = pr.base.ref, head = pr.head.ref;
            if (!(base === 'main' && head === 'dev') && !(base === 'dev' && !['main', 'dev'].includes(head))) {
              throw new Error('Allowed paths: feature/fix branches -> dev; dev -> main.');
            }
            const allowed = ['version:major', 'version:minor', 'version:build', 'version:revision'];
            const selected = pr.labels.map(label => label.name).filter(name => allowed.includes(name));
            if (base === 'main' && selected.length !== 1) throw new Error(`Select exactly one version label: ${allowed.join(', ')}.`);
            if (pr.mergeable === false || !pr.merge_commit_sha) throw new Error('PR cannot be merged yet. Resolve conflicts or retry once GitHub has calculated the merge.');
            const { data: merge } = await github.rest.git.getCommit({ ...context.repo, commit_sha: pr.merge_commit_sha });
            if (!merge.parents.some(p => p.sha === pr.head.sha) || !merge.parents.some(p => p.sha === pr.base.sha)) {
              throw new Error('The PR merge snapshot is stale. Retry after GitHub refreshes it.');
            }
            core.setOutput('test_sha', pr.merge_commit_sha);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('version_label', base === 'main' ? selected[0] : '');
            core.info(`Testing PR #${number}: ${head} -> ${base} at ${pr.merge_commit_sha}`);
          } catch (error) {
            await status('failure');
            throw error;
          }
  build-solution:
    name: Build Release
    runs-on: windows-latest
    needs: validate-pr
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.validate-pr.outputs.test_sha }}
        persist-credentials: false

    - name: Check workflow contracts
      shell: pwsh
      run: ./.github/scripts/validate-test-workflow.ps1

    - name: Set up .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: 8.0.x

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Cache NuGet packages
      uses: actions/cache@v6.1.0
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'test/**/*.csproj', 'src/**/*.props') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Build Release solution
      # 使用 msbuild 而非 dotnet build，确保 .sln 的 Platform Mapping 生效：
      # VirtualPaper.UI（WinAppSDK）在 .sln 中映射为 Release|x64，
      # dotnet build 不读取此映射，msbuild 才能正确路由到 x64 构建。
      # 与 pre-release.yml 保持工具链一致。
      run: msbuild src/VirtualPaper.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /restore /m

    - name: Check test hosts
      run: |
        $hostRoot = 'test/VirtualPaper.UIOperationTest/bin/x64/Release/net8.0-windows10.0.19041.0'
        foreach ($file in @('VirtualPaper.UIOperationTest.exe', 'VirtualPaper.Common.dll')) {
          if (-not (Test-Path -LiteralPath (Join-Path $hostRoot $file))) { throw "WinUI host output missing: $file" }
        }
        if (-not (Test-Path -LiteralPath 'test/VirtualPaper.InstallerTest/bin/Release/net8.0-windows10.0.19041.0/VirtualPaper.InstallerTest.dll')) {
          throw 'Installer test host output missing.'
        }

    - name: Upload build output
      uses: actions/upload-artifact@v7.0.2
      with:
        overwrite: true
        name: build-output
        if-no-files-found: error
        retention-days: 7
        path: |
          src/
          test/actions/run-project/action.yml
          test/Run-ProjectTests.ps1
          test/TestReportSupport.ps1
          test/VirtualPaper.UIOperationTest/VirtualPaper.UIOperationTest.csproj
          test/VirtualPaper.UIOperationTest/bin/x64/Release/
          test/VirtualPaper.InstallerTest/VirtualPaper.InstallerTest.csproj
          test/VirtualPaper.InstallerTest/bin/Release/

  # Build once, package both formats, then require all project tests before channel acceptance.
  package-exe:
    name: Package EXE
    runs-on: windows-latest
    needs: [validate-pr, build-solution]
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.validate-pr.outputs.test_sha }}
        persist-credentials: false
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-output
        path: .
    - name: Install Inno Setup 6.7.1
      run: choco install innosetup --version=6.7.1 --no-progress -y
    - name: Package EXE
      env:
        SOURCE_SHA: ${{ needs.validate-pr.outputs.test_sha }}
      run: ./.github/scripts/New-CIExePackage.ps1 -SourceSha $env:SOURCE_SHA
    - name: Upload package-exe
      uses: actions/upload-artifact@v7.0.2
      with:
        overwrite: true
        name: package-exe
        path: dist/exe/
        if-no-files-found: error
        retention-days: 30
  package-msix:
    name: Package MSIX
    runs-on: windows-latest
    needs: [validate-pr, build-solution]
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.validate-pr.outputs.test_sha }}
        persist-credentials: false
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-output
        path: .
    - name: Set up .NET
      uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: 8.0.x
    - name: Package signed MSIX
      env:
        SOURCE_SHA: ${{ needs.validate-pr.outputs.test_sha }}
      run: ./.github/scripts/New-CIMsixPackage.ps1 -SourceSha $env:SOURCE_SHA
    - name: Upload package-msix
      uses: actions/upload-artifact@v7.0.2
      with:
        overwrite: true
        name: package-msix
        path: |
          dist/msix/*.msix
          dist/msix/*.msixupload
          dist/msix/*.appxupload
          dist/msix/package.json
          dist/msix/acceptance.cer
        if-no-files-found: error
        retention-days: 30
  packages-ready:
    name: Packages Ready
    runs-on: ubuntu-latest
    needs: [validate-pr, build-solution, package-exe, package-msix]
    if: always() && !cancelled()
    steps:
    - name: Require selected packages
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
        MSIX_ENABLED: 'true'
      run: |
        $jobs = $env:JOB_RESULTS | ConvertFrom-Json -AsHashtable
        foreach ($name in @('validate-pr', 'build-solution', 'package-exe')) {
          if ($jobs[$name].result -ne 'success') { throw "Required prerequisite failed: $name" }
        }
        $expected = if ($env:MSIX_ENABLED -eq 'true') { 'success' } else { 'skipped' }
        if ($jobs['package-msix'].result -ne $expected) { throw 'MSIX packaging did not match channel selection.' }
  test-artifacts:
    name: Artifact Tests
    runs-on: windows-latest
    needs: [validate-pr, build-solution, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-artifacts
        require-complete-execution: 'true'
  test-core:
    name: Core Tests
    runs-on: windows-latest
    needs: [validate-pr, build-solution, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-core
        require-complete-execution: 'true'
  test-ui-logic:
    name: UI Logic Tests
    runs-on: windows-latest
    needs: [validate-pr, build-solution, packages-ready]
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.validate-pr.outputs.test_sha }}
        persist-credentials: false
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-output
        path: .
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Test web players
      run: |
        node .github/scripts/test-atmosphere.cjs
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        node .github/scripts/test-depth-player.cjs
        exit $LASTEXITCODE
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-ui-logic
        require-complete-execution: 'true'
  test-images:
    name: Static Image Tests
    runs-on: windows-latest
    needs: [validate-pr, build-solution, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-images
        require-complete-execution: 'true'
  test-web-backdrop:
    name: Web Backdrop Tests
    runs-on: windows-latest
    needs: [validate-pr, build-solution, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-web-backdrop
        require-complete-execution: 'true'
  test-ui-components:
    name: UI Component Tests
    runs-on: windows-latest
    needs: [validate-pr, build-solution, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-ui-components
        require-complete-execution: 'true'
  test-ml:
    name: ML Tests
    runs-on: windows-latest
    needs: [validate-pr, build-solution, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-ml
        include-ml-integration: ${{ inputs.include_ml_integration }}
        require-complete-execution: 'true'
  test-shader:
    name: Shader Tests
    runs-on: windows-latest
    needs: [validate-pr, build-solution, packages-ready]
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8.0.2
      with:
        name: build-output
        path: .
    - name: Run project tests
      uses: ./test/actions/run-project
      with:
        job-id: test-shader
        require-complete-execution: 'true'
  test-exe-acceptance:
    name: EXE Installed Acceptance
    needs: [validate-pr, build-solution, packages-ready, test-artifacts, test-core, test-ui-logic, test-images, test-web-backdrop, test-ui-components, test-ml, test-shader]
    uses: ./.github/workflows/package-acceptance.yml
    with:
      channel: exe
      source-sha: ${{ needs.validate-pr.outputs.test_sha }}
      build-artifact: build-output
  test-msix-acceptance:
    name: MSIX Installed Acceptance
    needs: [validate-pr, build-solution, packages-ready, test-artifacts, test-core, test-ui-logic, test-images, test-web-backdrop, test-ui-components, test-ml, test-shader]
    uses: ./.github/workflows/package-acceptance.yml
    with:
      channel: msix
      source-sha: ${{ needs.validate-pr.outputs.test_sha }}
      build-artifact: build-output
  summarize-tests:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [validate-pr, build-solution, package-exe, package-msix, packages-ready, test-artifacts, test-core, test-ui-logic, test-images, test-web-backdrop, test-ui-components, test-ml, test-shader, test-exe-acceptance, test-msix-acceptance]
    if: always() && needs.validate-pr.result == 'success'
    outputs:
      ui_outcome: ${{ steps.reports.outputs.ui_outcome }}
    steps:
    - name: Check out source
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.validate-pr.outputs.test_sha }}
        persist-credentials: false
    - name: Download test reports
      uses: actions/download-artifact@v8.0.2
      with:
        pattern: test-results-*
        path: TestResults/
    - name: Download package-exe
      uses: actions/download-artifact@v8.0.2
      with:
        name: package-exe
        path: PackageArtifacts/exe
    - name: Download package-msix
      if: always() && needs.package-msix.result == 'success'
      uses: actions/download-artifact@v8.0.2
      with:
        name: package-msix
        path: PackageArtifacts/msix
    - name: Summarize package acceptance
      id: reports
      if: always()
      env:
        JOB_RESULTS: ${{ toJSON(needs) }}
        SOURCE_SHA: ${{ needs.validate-pr.outputs.test_sha }}
        MSIX_ENABLED: 'true'
      run: |
        ./test/Summarize-PipelineTests.ps1 -Root TestResults -ArtifactsRoot PackageArtifacts `
          -SourceSha $env:SOURCE_SHA -JobResultsJson $env:JOB_RESULTS -MsixEnabled:($env:MSIX_ENABLED -eq 'true')
    - name: Upload test summary
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        overwrite: true
        name: test-summary-${{ needs.validate-pr.outputs.head_sha }}
        path: TestResults/
        if-no-files-found: warn
        retention-days: 30
    - name: Update PR status
      if: always()
      uses: actions/github-script@v7
      env:
        REPORT_JOB_STATUS: ${{ job.status }}
        JOB_RESULTS: ${{ toJSON(needs) }}
        UI_OUTCOME: ${{ steps.reports.outputs.ui_outcome }}
      with:
        script: |
          const { data: pr } = await github.rest.pulls.get({
            ...context.repo, pull_number: Number(context.payload.inputs.pr_number)
          });
          const passed = process.env.REPORT_JOB_STATUS === 'success' &&
            Object.values(JSON.parse(process.env.JOB_RESULTS)).every(job => job.result === 'success') &&
            process.env.UI_OUTCOME === 'Passed';
          let state = passed ? 'success' : 'failure';
          let description = passed ? 'All required checks passed [OK]' : 'Required checks failed or results missing [FAILED]';
          const head = '${{ needs.validate-pr.outputs.head_sha }}';
          const selected = pr.labels.map(label => label.name).filter(name =>
            ['version:major', 'version:minor', 'version:build', 'version:revision'].includes(name));
          if (pr.labels.some(label => label.name === 'channel:msstore') !== ('${{ needs.validate-pr.outputs.msstore_enabled }}' === 'true') ||
              pr.state !== 'open' || pr.head.sha !== head ||
              pr.base.sha !== '${{ needs.validate-pr.outputs.base_sha }}' ||
              (pr.base.ref === 'main' && (pr.head.ref !== 'dev' || selected.length !== 1 || selected[0] !== '${{ needs.validate-pr.outputs.version_label }}')) ||
              !((pr.base.ref === 'main' && pr.head.ref === 'dev') || (pr.base.ref === 'dev' && !['main', 'dev'].includes(pr.head.ref)))) {
            state = 'failure';
            description = 'PR changed during this run; manually rerun Pre-merge Check';
          }
          const marker = pr.base.ref === 'main' ? `PR #${context.payload.inputs.pr_number} | ${{ needs.validate-pr.outputs.version_label }} | msstore:${{ needs.validate-pr.outputs.msstore_enabled }}` : `PR #${context.payload.inputs.pr_number}`;
          description = `[${marker}] ${description}`;
          await github.rest.repos.createCommitStatus({
            ...context.repo, sha: head, state, description,
            target_url: `${context.payload.repository.html_url}/actions/runs/${context.runId}`,
            context: 'pre-merge-check'
          });
          if (state !== 'success') core.setFailed(description);
